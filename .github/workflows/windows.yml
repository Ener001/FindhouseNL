# Her push'ta Windows kurulum dosyasını (FindHouseInNL-Setup.exe) GitHub'ın Windows
# sunucusunda derler ve "Releases" bölümüne koyar. İndirme linki hep aynı kalır:
# https://github.com/Ener001/FindhouseNL/releases/latest/download/FindHouseInNL-Setup.exe
name: Windows kurulum dosyası

on:
  push:
    branches: [master]
    paths-ignore:
      - "FindHouseInNL.apk"
      - "version.json"
      - "index.html"
      - "**.md"
      - ".nojekyll"
      - "android-yayinla.bat"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-app.txt pyinstaller

      - name: Sürüm numarasını yaz
        shell: bash
        run: echo "BUILD = ${{ github.run_number }}" > evbul/_build.py

      - name: Programı derle (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --windowed --name FindHouseInNL
          --icon assets/icon.ico
          --add-data "evbul/static;evbul/static"
          --add-data "config.example.yaml;."
          --collect-all playwright
          --hidden-import pystray._win32
          app.py

      - name: Kurulum dosyasını oluştur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVer=1.${{ github.run_number }}" installer\FindHouseInNL.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Yayınla (GitHub Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: b${{ github.run_number }}
          name: FindHouseInNL 1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'Elle başlatılan derleme' }}
          files: installer/Output/FindHouseInNL-Setup.exe
          make_latest: true
